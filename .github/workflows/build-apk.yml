name: Build Kismat Ka Khel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip Kismat_Ka_Khel_Firebase_OTP_Firestore_FRESH_V2.zip -d project
      - name: Configure AndroidX and debug keystore
        run: |
          touch project/gradle.properties
          grep -qxF 'android.useAndroidX=true' project/gradle.properties || echo 'android.useAndroidX=true' >> project/gradle.properties
          grep -qxF 'android.enableJetifier=true' project/gradle.properties || echo 'android.enableJetifier=true' >> project/gradle.properties
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Show SHA fingerprints
        working-directory: project
        run: gradle signingReport
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kismat-Ka-Khel-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
